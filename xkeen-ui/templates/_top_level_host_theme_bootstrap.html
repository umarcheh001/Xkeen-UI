<script>
  (function () {
    var theme = 'light';
    try {
      var attr = document.documentElement.getAttribute('data-theme');
      var stored = localStorage.getItem('xkeen-theme');
      if (attr === 'light' || attr === 'dark') {
        theme = attr;
      } else if (stored === 'light' || stored === 'dark') {
        theme = stored;
      } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        theme = 'dark';
      }
    } catch (e) {
      try {
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          theme = 'dark';
        }
      } catch (e2) {}
    }
    document.documentElement.setAttribute('data-theme', theme);
    document.documentElement.style.colorScheme = theme;

    // The main panel still loads its historical blue compatibility stylesheet
    // before the late Operator override. Cover only that short first-paint
    // window when arriving from DevTools; the guard is removed by a tiny
    // inline script after the final stylesheet tag in panel.html.
    try {
      var isPanelPath = (location.pathname || '') === '/' || /\/panel(?:\/|$)/.test(location.pathname || '');
      if (/\/devtools(?:[?#]|$)/.test(document.referrer || '') && isPanelPath) {
        document.documentElement.classList.add('xk-panel-operator-pending');
        var guard = document.createElement('style');
        guard.id = 'xk-panel-operator-paint-guard';
        guard.textContent = 'html.xk-panel-operator-pending::after{content:"";position:fixed;inset:0;z-index:2147483647;background:#0d0f13;pointer-events:none}html[data-theme="light"].xk-panel-operator-pending::after{background:#f1f2f5}';
        document.head.appendChild(guard);
      }
    } catch (e3) {}
  })();
</script>
