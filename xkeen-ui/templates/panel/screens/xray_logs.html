{% from "panel/macros.html" import op_icon %}
    <div id="view-xray-logs" class="view-section"{{ ' style="display:none;"'|safe if page_context.initial_view != 'xray-logs' else '' }} data-xk-section="xray-logs">
      <section class="card log-card xk-logs-live-card xk-xlog-card" aria-labelledby="xray-logs-title" data-xlog-file="access">
        <div class="xk-xlog-head">
          <h2 id="xray-logs-title" class="xk-xlog-title">Логи Xray <span id="xray-log-lamp" class="xray-log-lamp xk-xlog-live" data-state="unknown" title="Статус логов Xray неизвестен"><i aria-hidden="true"></i><span data-xlog-live-label>Нет данных</span></span></h2>
          <div class="xk-xlog-seg" role="radiogroup" aria-label="Файл лога">
            <button type="button" role="radio" class="xk-xlog-seg-btn" data-xlog-file-btn="access" aria-checked="true">access<span class="n" data-xlog-file-count="access"></span></button>
            <button type="button" role="radio" class="xk-xlog-seg-btn" data-xlog-file-btn="error" aria-checked="false">error<span class="n" data-xlog-file-count="error"></span></button>
          </div>
          <select id="xray-log-file" class="xray-log-select" aria-label="Файл лога" hidden>
            <option value="access" selected>access.log</option>
            <option value="error">error.log</option>
          </select>
          <select
            id="xray-log-level"
            class="xray-log-select xk-xlog-level"
            aria-label="Уровень логирования"
            title="Уровень логирования Xray (loglevel). Это минимальный уровень: debug включает info/warning/error, info включает warning/error и т.д. Если логи уже включены, новый уровень применяется сразу."
          >
            <option value="debug">уровень: debug</option>
            <option value="info">уровень: info</option>
            <option value="warning" selected>уровень: warning</option>
            <option value="error">уровень: error</option>
          </select>
          <div class="xk-xlog-seg xk-xlog-run" role="group" aria-label="Запись логов">
            <button type="button" class="xk-xlog-seg-btn is-play" id="xray-log-enable-btn" title="Пуск: включить запись логов и онлайн-поток" aria-label="Пуск">{{ op_icon('play') }}<span>Пуск</span></button>
            <button type="button" class="xk-xlog-seg-btn is-pause" id="xray-log-pause" title="Пауза: заморозить вывод (строки продолжают собираться)." aria-label="Пауза">{{ op_icon('pause') }}<span class="xk-action-label">Пауза</span></button>
            <button type="button" class="xk-xlog-seg-btn is-stop" id="xray-log-disable-btn" title="Стоп: выключить запись логов Xray" aria-label="Стоп">{{ op_icon('stop') }}<span>Стоп</span></button>
          </div>
          <span class="xk-xlog-spacer"></span>
          <div class="xk-xlog-search" role="search" aria-label="Поиск по логам Xray">
            {{ op_icon('search') }}
            <input id="xray-log-filter" type="text" class="xray-log-filter" placeholder="Поиск: домен, IP, узел…" aria-label="Поиск по логам" autocomplete="off" spellcheck="false" />
            <button id="xray-log-filter-clear" type="button" class="xk-xlog-search-clear" title="Очистить поиск" aria-label="Очистить поиск" hidden>{{ op_icon('close') }}</button>
            <kbd class="xk-xlog-kbd" aria-hidden="true">/</kbd>
          </div>
          <details class="dt-log-menu xk-xlog-menu" id="xray-log-more">
            <summary class="btn-secondary xk-xlog-icon-btn" title="Ещё" aria-label="Ещё">{{ op_icon('more') }}</summary>
            <div class="dt-log-menu-panel xk-xlog-menu-panel" role="menu" aria-label="Дополнительные действия">
              <div class="xk-xlog-menu-title">Вид</div>
              <label class="xk-xlog-menu-item" title="Авто‑прокрутка к новым строкам.">{{ op_icon('move-down') }}<span>Следить за концом</span>
                <span class="dt-switch"><input id="xray-log-follow" type="checkbox" checked /><span class="dt-switch-slider" aria-hidden="true"></span></span></label>
              <label class="xk-xlog-menu-item" title="Показывать доменные имена рядом с IP-адресами.">{{ op_icon('dns') }}<span>Домены рядом с IP</span>
                <span class="dt-switch"><input id="xray-log-toggle-domains" type="checkbox" /><span class="dt-switch-slider" aria-hidden="true"></span></span></label>
              <label class="xk-xlog-menu-item" title="Сводка над таблицей access.log.">{{ op_icon('list-details') }}<span>Сводка над таблицей</span>
                <span class="dt-switch"><input id="xray-log-show-summary" type="checkbox" checked /><span class="dt-switch-slider" aria-hidden="true"></span></span></label>
              <label class="xk-xlog-menu-item" title="Строки, которые панель не смогла разобрать, показываются целиком.">{{ op_icon('list-details') }}<span>Неразобранные строки</span>
                <span class="dt-switch"><input id="xray-log-show-raw" type="checkbox" /><span class="dt-switch-slider" aria-hidden="true"></span></span></label>
              <label class="xk-xlog-menu-item" title="Онлайн-режим: автообновление новых строк.">{{ op_icon('refresh') }}<span>Автообновление</span>
                <span class="dt-switch"><input id="xray-log-live" type="checkbox" /><span class="dt-switch-slider" aria-hidden="true"></span></span></label>
              <div class="xk-xlog-menu-item" title="Сколько строк держать в окне.">{{ op_icon('list-details') }}<span>Строк в окне</span>
                <input id="xray-log-lines" class="dt-log-lines-input" type="number" min="50" max="5000" step="50" value="800" aria-label="Количество строк" /></div>
              <div class="xk-xlog-menu-item" title="Интервал опроса, когда WebSocket недоступен.">{{ op_icon('refresh') }}<span>Опрос без WebSocket</span>
                <select id="xray-log-interval" class="xray-log-select" aria-label="Интервал">
                  <option value="1000">1 с</option>
                  <option value="2000" selected>2 с</option>
                  <option value="5000">5 с</option>
                  <option value="10000">10 с</option>
                  <option value="30000">30 с</option>
                </select></div>
              <div class="xk-xlog-menu-sep"></div>
              <div class="xk-xlog-menu-title">Данные</div>
              <button type="button" class="xk-xlog-menu-item" id="xray-log-copy-btn" role="menuitem" title="Скопировать строки, видимые после фильтров.">{{ op_icon('duplicate') }}<span>Копировать видимое</span><em data-xlog-visible-count></em></button>
              <button type="button" class="xk-xlog-menu-item" id="xray-log-download" role="menuitem" title="Скачать текущий логфайл.">{{ op_icon('download') }}<span>Скачать <span data-xlog-file-name>access.log</span></span></button>
              <button type="button" class="xk-xlog-menu-item" id="xray-log-load-more" role="menuitem" title="Подгрузить более старые строки (увеличить окно назад).">{{ op_icon('upload') }}<span>Загрузить более старые</span></button>
              <button type="button" class="xk-xlog-menu-item" id="xray-log-view-btn" role="menuitem" title="Перечитать снимок файла с роутера.">{{ op_icon('refresh') }}<span>Обновить снимок</span></button>
              <button type="button" class="xk-xlog-menu-item" id="xray-log-devices-btn" role="menuitem" title="Имена устройств">{{ op_icon('devices') }}<span>Имена устройств…</span></button>
              <button type="button" class="xk-xlog-menu-item" id="xray-log-clear-screen-btn" role="menuitem" title="Очистить экран журнала" aria-label="Очистить отображение журнала">{{ op_icon('broom') }}<span>Очистить экран</span></button>
              <div class="xk-xlog-menu-sep"></div>
              <button type="button" class="xk-xlog-menu-item is-danger" id="xray-log-clear-files-btn" role="menuitem" title="Очистить логфайлы" aria-label="Очистить логфайлы">{{ op_icon('trash') }}<span>Очистить файлы логов…</span></button>
            </div>
          </details>
          <button type="button" class="btn-secondary xk-xlog-icon-btn" id="xray-log-fullscreen" title="Полный экран" aria-label="Полный экран">{{ op_icon('fullscreen') }}</button>
        </div>

        <div class="xk-xlog-summary" id="xray-log-summary" aria-label="Сводка по соединениям">
          <button type="button" class="xk-xlog-summary-head" data-xlog-summary-toggle aria-expanded="false" aria-controls="xray-log-summary-body">
            <span class="t">Сводка</span><span class="xk-xlog-mini" data-xlog-summary-mini></span><span class="xk-xlog-grp" data-xlog-summary-extra></span>
            <span class="xk-xlog-summary-tog"><span data-xlog-summary-toggle-label>Развернуть</span>{{ op_icon('chevron-down') }}</span>
          </button>
          <div class="xk-xlog-summary-body" id="xray-log-summary-body" data-xlog-summary-body hidden></div>
        </div>

        <div class="xk-xlog-chips" id="xray-log-chips" aria-label="Фильтры журнала"></div>

        <div class="xk-xlog-box">
          <div id="xray-log-output" class="xk-xlog-output is-table" role="grid" aria-label="Строки лога Xray" tabindex="0"></div>
          <button type="button" id="xray-log-scroll-bottom" class="xk-xlog-float" title="Прокрутить к последним показанным строкам." aria-label="Прокрутить к последним строкам лога" hidden>К последним</button>
          <button type="button" id="xray-log-new-lines" class="xk-xlog-float" title="Снять паузу и показать накопившиеся строки." hidden>{{ op_icon('move-down') }}<span data-xlog-new-label></span></button>
          <div class="xk-xlog-selbar" id="xray-log-selbar" role="toolbar" aria-label="Выбранные строки" hidden>
            <span>Выбрано <b data-xlog-selcount>0</b></span>
            <span class="hint">Shift+клик · Ctrl+A · Ctrl+C</span>
            <button type="button" class="btn-primary xk-xlog-btn" data-xlog-act="copy-selected">{{ op_icon('duplicate') }}Копировать строки лога</button>
            <button type="button" class="btn-secondary xk-xlog-btn" data-xlog-act="copy-selected-tsv">{{ op_icon('list-details') }}Копировать таблицей</button>
            <button type="button" class="btn-secondary xk-xlog-icon-btn" data-xlog-act="clear-selection" title="Снять выбор" aria-label="Снять выбор">{{ op_icon('close') }}</button>
          </div>
          <div class="xk-xlog-foot">
            <span class="small dt-log-stats" id="xray-log-stats" aria-live="polite"></span>
            <span class="xk-xlog-raw-note" data-xlog-raw-note hidden></span>
            <span class="xk-xlog-spacer"></span>
            <span class="small xray-log-mode" id="xray-log-mode" aria-live="polite">Вручную</span>
          </div>
        </div>
        <div id="xray-log-status" class="status xk-log-state" role="status" aria-live="polite"></div>
      </section>

      <!-- Restart log (Xray logs online) -->
      <section class="card log-card xk-restart-log-card xk-xray-logs-log-card">
        <div class="log-header-row">
          <h2>Журнал операций Xkeen</h2>
          <div class="log-header-actions">
            <button type="button" class="btn-secondary log-btn btn-icon restart-log-filter-btn" data-xk-restart-log-filter="all" aria-pressed="true" title="Показать все записи" aria-label="Показать все записи">{{ op_icon('list-details') }}</button>
            <button type="button" class="btn-secondary log-btn btn-icon restart-log-filter-btn" data-xk-restart-log-filter="errors" aria-pressed="false" title="Показать только ошибки" aria-label="Показать только ошибки">{{ op_icon('alert') }}</button>
            <button type="button" class="btn-secondary log-btn btn-icon" data-xk-restart-log-action="refresh" title="Обновить журнал" aria-label="Обновить журнал">{{ op_icon('refresh') }}</button>
            <button type="button" class="btn-secondary log-btn btn-icon" data-xk-restart-log-action="clear" title="Очистить журнал" aria-label="Очистить журнал">{{ op_icon('clear') }}</button>
            <button type="button" class="btn-secondary log-btn btn-icon" data-xk-restart-log-action="copy" title="Скопировать журнал" aria-label="Скопировать журнал">{{ op_icon('duplicate') }}</button>
          </div>
        </div>
        <div class="restart-log-summary" data-xk-restart-log-summary="1" hidden></div>
        <pre class="log-block" data-xk-restart-log="1"></pre>
      </section>
    </div>
