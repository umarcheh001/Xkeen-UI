{% from "panel/macros.html" import op_icon %}
    <div id="view-xray-logs" class="view-section" style="display:none;" data-xk-section="xray-logs">
      <section class="card log-card xk-logs-live-card" aria-labelledby="xray-logs-title">
        <div class="log-header-row">
          <h2 id="xray-logs-title">Логи Xray онлайн <span id="xray-log-lamp" class="xray-log-lamp" data-state="unknown" title="Статус логов Xray неизвестен"></span></h2>
          <div class="log-header-actions" aria-label="Источник и действия журнала">
            <select id="xray-log-file" class="xray-log-select" aria-label="Файл лога">
              <option value="access" selected>access.log</option>
              <option value="error">error.log</option>
            </select>
            <select
              id="xray-log-level"
              class="xray-log-select"
              aria-label="Уровень логирования"
              title="Уровень логирования Xray (loglevel) для error.log. Это минимальный уровень: debug включает info/warning/error, info включает warning/error и т.д. При смене уровня, если логи уже включены, уровень применяется сразу. Также используется как фильтр отображения в окне."
            >
              <option value="debug">debug</option>
              <option value="info">info</option>
              <option value="warning" selected>warning</option>
              <option value="error">error</option>
            </select>
            <button type="button" class="btn-secondary log-btn icon-only" id="xray-log-view-btn" title="Просмотреть логи" aria-label="Просмотреть логи">{{ op_icon('search') }}</button>
            <button type="button" class="btn-secondary log-btn icon-only" id="xray-log-enable-btn" title="Включить логи" aria-label="Включить логи">{{ op_icon('play') }}</button>
            <button type="button" class="btn-secondary log-btn icon-only" id="xray-log-disable-btn" title="Остановить логи" aria-label="Остановить логи">{{ op_icon('stop') }}</button>
            <button type="button" class="btn-secondary log-btn icon-only" id="xray-log-toggle-domains" title="Показывать доменные имена рядом с IP-адресами" aria-label="Показывать доменные имена рядом с IP-адресами" aria-pressed="false">{{ op_icon('dns') }}</button>
            <button type="button" class="btn-secondary log-btn icon-only" id="xray-log-clear-screen-btn" title="Очистить экран журнала" aria-label="Очистить отображение журнала">{{ op_icon('broom') }}</button>
            <button type="button" class="btn-secondary log-btn icon-only" id="xray-log-clear-files-btn" title="Очистить логфайлы" aria-label="Очистить логфайлы">{{ op_icon('trash') }}</button>
            <button type="button" class="btn-secondary log-btn icon-only" id="xray-log-copy-btn" title="Скопировать" aria-label="Скопировать">{{ op_icon('duplicate') }}</button>
            <button type="button" class="btn-secondary log-btn icon-only" id="xray-log-devices-btn" title="Имена устройств" aria-label="Имена устройств">{{ op_icon('devices') }}</button>
            <button type="button" class="btn-secondary log-btn icon-only" id="xray-log-fullscreen" title="Полный экран" aria-label="Полный экран">{{ op_icon('fullscreen') }}</button>
          </div>
        </div>
        <div class="log-filter-row xk-log-filter-bar" role="search" aria-label="Фильтр логов Xray">
          <input
            id="xray-log-filter"
            type="text"
            class="xray-log-filter"
            placeholder="Фильтр по логам (пример: error xray)"
          />
          <button
            id="xray-log-filter-clear"
            type="button"
            class="btn-secondary log-btn"
            title="Очистить фильтр"
            aria-label="Очистить фильтр"
          >
            {{ op_icon('close') }}
          </button>
        </div>
        <div class="dt-log-controls xray-log-controls xk-log-control-bar" aria-label="Управление логами Xray">
          <label class="dt-switch" title="Онлайн-режим: автообновление новых строк.">
            <input id="xray-log-live" type="checkbox" />
            <span class="dt-switch-slider" aria-hidden="true"></span>
            <span class="dt-switch-label">Онлайн</span>
          </label>

          <div class="dt-log-interval" title="Интервал авто‑обновления (используется при HTTP‑поллинге).">
            <span class="dt-log-interval-label">каждые</span>
            <select id="xray-log-interval" class="xray-log-select" aria-label="Интервал">
              <option value="1000">1s</option>
              <option value="2000" selected>2s</option>
              <option value="5000">5s</option>
              <option value="10000">10s</option>
              <option value="30000">30s</option>
            </select>
          </div>

          <label class="dt-switch" title="Авто‑прокрутка в конец при обновлении.">
            <input id="xray-log-follow" type="checkbox" checked />
            <span class="dt-switch-slider" aria-hidden="true"></span>
            <span class="dt-switch-label">В конец</span>
          </label>

          <button type="button" id="xray-log-pause" class="btn-secondary dt-log-btn" title="Пауза: заморозить вывод (строки продолжают собираться)." aria-label="Пауза">{{ op_icon('pause') }}<span class="xk-action-label">Пауза</span></button>

          <button type="button" id="xray-log-scroll-bottom" class="btn-secondary dt-log-btn xray-log-scroll-btn" title="Прокрутить к последним показанным строкам." aria-label="Прокрутить к последним строкам лога" hidden>К последним</button>

          <details class="dt-log-menu" id="xray-log-more">
            <summary class="btn-secondary dt-log-btn" title="Дополнительно" aria-label="Дополнительно">{{ op_icon('more') }}</summary>
            <div class="dt-log-menu-panel" role="menu" aria-label="Дополнительные действия">
  <div class="dt-log-menu-row" aria-label="Окно логов">
    <span class="small" style="opacity:0.85;">Строк</span>
    <input id="xray-log-lines" class="dt-log-lines-input" type="number" min="50" max="5000" step="50" value="800" aria-label="Количество строк" />
  </div>
  <button type="button" id="xray-log-copy-selection" class="btn-secondary dt-log-btn" title="Скопировать выделенное в буфер обмена.">Скопировать выделенное</button>
  <button type="button" id="xray-log-download" class="btn-secondary dt-log-btn" title="Скачать текущий логфайл.">Скачать</button>
  <button type="button" id="xray-log-load-more" class="btn-secondary dt-log-btn" title="Подгрузить более старые строки (увеличить окно назад).">Загрузить ещё</button>
</div>
          </details>

          <div class="xk-log-counters" aria-label="Состояние и счётчики журнала">
            <span class="small xray-log-mode" id="xray-log-mode" aria-live="polite">Вручную</span>
            <span class="small dt-log-stats" id="xray-log-stats" aria-live="polite"></span>
          </div>
        </div>

        <pre id="xray-log-output" class="log-block xray-log-block" aria-label="Строки лога Xray" tabindex="0"></pre>
        <div id="xray-log-status" class="status xk-log-state" role="status" aria-live="polite"></div>
      </section>

      <!-- Restart log (Xray logs online) -->
      <section class="card log-card xk-restart-log-card xk-xray-logs-log-card">
        <div class="log-header-row">
          <h2>Журнал операций Xkeen</h2>
          <div class="log-header-actions">
            <button type="button" class="btn-secondary log-btn btn-icon restart-log-filter-btn" data-xk-restart-log-filter="all" aria-pressed="true" title="Показать все записи" aria-label="Показать все записи">{{ op_icon('list-details') }}</button>
            <button type="button" class="btn-secondary log-btn btn-icon restart-log-filter-btn" data-xk-restart-log-filter="errors" aria-pressed="false" title="Показать только ошибки" aria-label="Показать только ошибки">{{ op_icon('alert') }}</button>
            <button type="button" class="btn-secondary log-btn btn-icon" data-xk-restart-log-action="refresh" title="Обновить журнал" aria-label="Обновить журнал">{{ op_icon('refresh') }}</button>
            <button type="button" class="btn-secondary log-btn btn-icon" data-xk-restart-log-action="clear" title="Очистить журнал" aria-label="Очистить журнал">{{ op_icon('clear') }}</button>
            <button type="button" class="btn-secondary log-btn btn-icon" data-xk-restart-log-action="copy" title="Скопировать журнал" aria-label="Скопировать журнал">{{ op_icon('duplicate') }}</button>
          </div>
        </div>
        <div class="restart-log-summary" data-xk-restart-log-summary="1" hidden></div>
        <pre class="log-block" data-xk-restart-log="1"></pre>
      </section>
    </div>
