{% from "panel/macros.html" import op_icon %}
    <div id="xk-resource-dashboard-modal" class="modal hidden xk-resource-dashboard-modal" data-operator-modal-family="master-detail" data-modal-key="resource-dashboard" role="dialog" aria-modal="true" aria-labelledby="xk-resource-dashboard-title">
      <div class="modal-content xk-resource-dashboard-content">
        <div class="modal-header xk-resource-dashboard-header">
          <div class="xk-resource-dashboard-heading">
            <span class="modal-title" id="xk-resource-dashboard-title">Диагностика роутера</span>
            <span id="xk-resource-dashboard-freshness" class="xk-resource-dashboard-freshness">Обновлено —</span>
          </div>
          <div class="xk-resource-dashboard-actions">
            <button type="button" class="btn-secondary btn-icon" id="xk-resource-dashboard-refresh" aria-label="Обновить" data-tooltip="Обновить: запросить свежие данные роутера">{{ op_icon('refresh') }}</button>
            <div class="xk-resource-more">
              <button type="button" class="btn-secondary btn-icon" id="xk-resource-more" aria-haspopup="true" aria-expanded="false" aria-controls="xk-resource-more-menu" aria-label="Ещё" data-tooltip="Ещё">{{ op_icon('more') }}</button>
              <div class="xk-resource-more-menu" id="xk-resource-more-menu" role="menu" hidden>
                <button type="button" role="menuitem" id="xk-resource-export" disabled data-tooltip="Скачать JSON: ресурсы и история за выбранный интервал, без IP-адресов, клиентов и журналов">Снимок JSON</button>
              </div>
            </div>
            <button type="button" class="modal-close" id="xk-resource-dashboard-close" aria-label="Закрыть" data-tooltip="Закрыть диагностику роутера">{{ op_icon('close') }}</button>
          </div>
        </div>
        <div class="modal-body xk-resource-dashboard-body">
          <div id="xk-resource-dashboard-view"></div>
        </div>
      </div>
    </div>
