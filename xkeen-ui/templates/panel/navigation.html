      </div>

      <div class="top-tabs header-tabs" role="navigation" aria-label="Разделы панели">
        {% for item in page_context.navigation_items %}
        <button class="{{ item.class_name }}{% if item.active %} active{% endif %}"
                {% if not item.view %}type="button" {% endif %}
                {% if item.view %}data-view="{{ item.view }}" {% endif %}
                data-xk-section="{{ item.section }}"
                {% if item.element_id %}id="{{ item.element_id }}" {% endif %}
                {% if item.href_endpoint %}data-nav-href="{{ url_for(item.href_endpoint) }}" {% endif %}
                {% if item.top_nav %}data-xk-top-nav="1"{% endif %}>
          {{ item.label }}
        </button>
        {% endfor %}
