<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Xkeen UI — Вход</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">

  <!-- Apply typography prefs ASAP (stored in localStorage) -->
  <script src="{{ url_for('static', filename='js/ui/typography.js', v='20251230c') }}"></script>
  <!-- Apply layout prefs ASAP (stored in localStorage) -->
  <script src="{{ url_for('static', filename='js/ui/layout.js', v='20260731a') }}"></script>
  <script src="{{ url_for('static', filename='js/ui/xk_brand.js', v='20260104a') }}"></script>

  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon-32x32.png') }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='favicon-16x16.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
  <link rel="manifest" href="{{ url_for('static', filename='site.webmanifest') }}">
  <meta name="theme-color" content="#0d0f13">
  <script>
    (function () {
      var theme = 'light';
      try {
        var attr = document.documentElement.getAttribute('data-theme');
        var stored = localStorage.getItem('xkeen-theme');
        if (attr === 'light' || attr === 'dark') {
          theme = attr;
        } else if (stored === 'light' || stored === 'dark') {
          theme = stored;
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          theme = 'dark';
        }
      } catch (e) {
        try {
          if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            theme = 'dark';
          }
        } catch (e2) {}
      }
      document.documentElement.setAttribute('data-theme', theme);
      document.documentElement.style.colorScheme = theme;
      var themeColor = document.querySelector('meta[name="theme-color"]');
      if (themeColor) themeColor.content = theme === 'light' ? '#f1f2f5' : '#0d0f13';
    })();
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css', v='20260824a') }}">
  <link rel="stylesheet" id="xk-terminal-theme-link" href="{{ url_for('terminal_theme_css', v=terminal_theme_v) }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='auth-operator.css', v='20260731a') }}">
</head>
<body class="auth-page">
  <div class="auth-wrap">
    <div class="card auth-card">
      <h1 class="auth-title">Вход в Xkeen UI</h1>
      <p class="auth-sub xk-card-desc">Введите логин и пароль администратора.</p>

      <form method="post" action="{{ url_for('login', next=request.args.get('next')) }}" autocomplete="off">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

        <div class="auth-row">
          <label for="username">Логин</label>
          <input id="username" name="username" type="text" value="{{ username or '' }}" autofocus required>
        </div>

        <div class="auth-row">
          <label for="password">Пароль</label>
          <input id="password" name="password" type="password" required>
        </div>

        <div class="auth-actions">
          <button class="auth-btn" type="submit">Войти</button>
          {% if not auth_configured %}
            <a href="{{ url_for('setup') }}">Первичная настройка</a>
          {% endif %}
        </div>
      </form>

      {% if error %}
        <div class="auth-error">{{ error }}</div>
      {% endif %}
    </div>
  </div>
</body>
</html>
