name: Publish Android beta

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build (branch, tag or commit)
        required: true
        default: main
        type: string
      tag:
        description: Existing GitHub Release tag; leave empty to validate only
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: publish-android-beta-${{ github.event_name }}-${{ github.ref_name }}-${{ inputs.tag || 'automatic' }}
  cancel-in-progress: false

jobs:
  publish-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Require Android signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.XKEEN_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.XKEEN_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.XKEEN_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.XKEEN_ANDROID_KEY_PASSWORD }}
        run: |
          for value in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!value}" ]]; then
              echo "Required Android signing secret is missing: $value" >&2
              exit 1
            fi
          done

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.XKEEN_ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/xkeen-mobile-release.jks"
          chmod 600 "$RUNNER_TEMP/xkeen-mobile-release.jks"

      - name: Test, lint and build signed APK
        working-directory: android-companion
        env:
          XKEEN_ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/xkeen-mobile-release.jks
          XKEEN_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.XKEEN_ANDROID_KEYSTORE_PASSWORD }}
          XKEEN_ANDROID_KEY_ALIAS: ${{ secrets.XKEEN_ANDROID_KEY_ALIAS }}
          XKEEN_ANDROID_KEY_PASSWORD: ${{ secrets.XKEEN_ANDROID_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest lintRelease assembleRelease --no-daemon --console=plain

      - name: Verify APK signing identity
        env:
          EXPECTED_SIGNER_SHA256: 05819dce865a15d3df466de8efc4733e03d8f6d9beb7c42bf5e1ab9d43b26abc
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          if [[ -z "$APKSIGNER" ]]; then
            echo "Android apksigner was not found" >&2
            exit 1
          fi
          APK=android-companion/app/build/outputs/apk/release/app-release.apk
          "$APKSIGNER" verify "$APK"
          ACTUAL_SIGNER_SHA256="$("$APKSIGNER" verify --print-certs "$APK" \
            | sed -n 's/^.*certificate SHA-256 digest: //p' | head -n1)"
          if [[ "$ACTUAL_SIGNER_SHA256" != "$EXPECTED_SIGNER_SHA256" ]]; then
            echo "APK signer does not match the published Android beta" >&2
            echo "Expected: $EXPECTED_SIGNER_SHA256" >&2
            echo "Actual:   ${ACTUAL_SIGNER_SHA256:-not found}" >&2
            exit 1
          fi

      - name: Prepare versioned release assets
        id: mobile
        run: |
          VERSION="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' android-companion/app/build.gradle.kts | head -n1)"
          VERSION_CODE="$(sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\)/\1/p' android-companion/app/build.gradle.kts | head -n1)"
          if [[ -z "$VERSION" || -z "$VERSION_CODE" ]]; then
            echo "Could not read Android versionName/versionCode" >&2
            exit 1
          fi
          mkdir -p dist-mobile
          cp android-companion/app/build/outputs/apk/release/app-release.apk \
            "dist-mobile/xkeen-mobile-$VERSION.apk"
          cp "dist-mobile/xkeen-mobile-$VERSION.apk" dist-mobile/xkeen-mobile-beta.apk
          sha256sum "dist-mobile/xkeen-mobile-$VERSION.apk" \
            > "dist-mobile/xkeen-mobile-$VERSION.apk.sha256"
          sha256sum dist-mobile/xkeen-mobile-beta.apk \
            > dist-mobile/xkeen-mobile-beta.apk.sha256
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: xkeen-mobile-${{ steps.mobile.outputs.version }}
          path: dist-mobile/
          if-no-files-found: error

      - name: Wait for GitHub Release created by the archive workflow
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          for attempt in $(seq 1 60); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              exit 0
            fi
            echo "Waiting for GitHub Release $TAG ($attempt/60)"
            sleep 15
          done
          echo "GitHub Release $TAG was not created within 15 minutes" >&2
          exit 1

      - name: Upload APK to GitHub Release
        if: github.event_name == 'push' || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          VERSION: ${{ steps.mobile.outputs.version }}
        run: |
          gh release view "$TAG" >/dev/null
          gh release upload "$TAG" \
            "dist-mobile/xkeen-mobile-$VERSION.apk" \
            "dist-mobile/xkeen-mobile-$VERSION.apk.sha256" \
            dist-mobile/xkeen-mobile-beta.apk \
            dist-mobile/xkeen-mobile-beta.apk.sha256 \
            --clobber
