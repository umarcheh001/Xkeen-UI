name: Build user archive

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: build-user-archive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # The Stage 3R.1 baseline generator reads its pinned historical
          # commit, so the archive validation checkout must include history.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.23"
          cache-dependency-path: tools/xk-geodat/go.sum

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend
        run: npm run frontend:build

      - name: Run Python tests
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee "$RUNNER_TEMP/pytest.log"

      # Журнал шага виден только участникам репозитория, а заметки — всем:
      # по ним понятно, какой тест упал и с чем, не открывая журнал.
      - name: Name the failed tests
        if: failure()
        run: |
          log="$RUNNER_TEMP/pytest.log"; [ -f "$log" ] || exit 0
          grep -E '^(FAILED|ERROR) ' "$log" | head -n 8 | while IFS= read -r line; do
            echo "::error title=pytest::$line"
          done
          details="$(grep -E '^E  ' "$log" | head -n 60 | cut -c1-300 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          [ -z "$details" ] || echo "::error title=pytest details::$details"

      - name: Verify frontend build
        run: node scripts/verify_frontend_build.mjs

      - name: Prepare package directory
        run: |
          rm -rf dist package-root
          mkdir -p dist package-root/xkeen-ui
          rsync -a xkeen-ui/ package-root/xkeen-ui/ \
            --exclude '__pycache__' \
            --exclude '.DS_Store'


      - name: Write BUILD.json
        env:
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
            UPDATE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/xkeen-ui-routing.tar.gz"
          else
            VERSION="${GITHUB_SHA::7}"
            UPDATE_URL=""
          fi

          export VERSION UPDATE_URL

          # Штамп пишется тем же кодом, что и локальная сборка, иначе две ветки
          # разъезжаются по набору полей. Здесь дерево — это ровно GITHUB_SHA
          # (чистый checkout), поэтому dirty=false и commit заполнен.
          python - <<'PY'
          import importlib.util
          import os
          import sys
          from pathlib import Path

          spec = importlib.util.spec_from_file_location("builder", "scripts/build_user_archive.py")
          builder = importlib.util.module_from_spec(spec)
          sys.modules["builder"] = builder
          spec.loader.exec_module(builder)

          root = Path("package-root/xkeen-ui")
          sha = os.environ["GITHUB_SHA"]
          # Сжатие статики — как в локальной сборке и до штампа: tree_sha256
          # должен описывать дерево вместе с .gz.
          packed = builder.precompress_static_assets(root)
          print(f"static precompressed: {packed.files} file(s), "
                f"{packed.original_bytes} -> {packed.compressed_bytes} bytes")
          # Карта «модуль → файлы» для менеджера модулей: после сжатия, чтобы
          # в неё попали .gz, и до штампа, чтобы tree_sha256 её учёл.
          print(builder.write_module_ownership_map(root, strict=True))
          builder.write_build_json(
              root,
              stamp=builder.BuildStamp(
                  version=os.environ["VERSION"],
                  base_commit=sha[:7],
                  commit=sha,
                  dirty=False,
              ),
              update_url=os.environ["UPDATE_URL"],
          )
          print((root / "BUILD.json").read_text(encoding="utf-8"))
          PY

      - name: Create user archive
        run: |
          tar -czf dist/xkeen-ui-routing.tar.gz -C package-root xkeen-ui
          sha256sum dist/xkeen-ui-routing.tar.gz > dist/xkeen-ui-routing.tar.gz.sha256

      - name: Build xk-geodat binaries
        working-directory: tools/xk-geodat
        run: |
          mkdir -p ../../dist

          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build \
            -trimpath -ldflags="-s -w" \
            -o ../../dist/xk-geodat-linux-arm64 \
            ./cmd/xk-geodat

          CGO_ENABLED=0 GOOS=linux GOARCH=mips GOMIPS=softfloat go build \
            -trimpath -ldflags="-s -w" \
            -o ../../dist/xk-geodat-linux-mips \
            ./cmd/xk-geodat

          CGO_ENABLED=0 GOOS=linux GOARCH=mipsle GOMIPS=softfloat go build \
            -trimpath -ldflags="-s -w" \
            -o ../../dist/xk-geodat-linux-mipsle \
            ./cmd/xk-geodat

      # Движку Happ нужен более свежий Go (golang.org/x/crypto), чем xk-geodat.
      # xk-geodat уже собран выше на своей версии, поэтому второй setup-go — здесь.
      - name: Set up Go for happ-decryptor
        uses: actions/setup-go@v6
        with:
          go-version-file: tools/happ-decryptor/go.mod
          cache-dependency-path: tools/happ-decryptor/go.sum

      - name: Test happ-decryptor
        working-directory: tools/happ-decryptor
        run: |
          go vet ./...
          go test ./...

      - name: Build happ-decrypt-universal binaries
        working-directory: tools/happ-decryptor
        run: |
          mkdir -p ../../dist

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="${GITHUB_SHA::7}"
          fi
          export VERSION COMMIT="${GITHUB_SHA::7}"

          GOOS=linux GOARCH=arm64 OUT=../../dist/happ-decrypt-universal-linux-arm64 bash build.sh
          GOOS=linux GOARCH=mips GOMIPS=softfloat OUT=../../dist/happ-decrypt-universal-linux-mips bash build.sh
          GOOS=linux GOARCH=mipsle GOMIPS=softfloat OUT=../../dist/happ-decrypt-universal-linux-mipsle bash build.sh

      - name: Create checksums
        run: |
          sha256sum dist/xkeen-ui-routing.tar.gz > dist/xkeen-ui-routing.tar.gz.sha256
          sha256sum dist/xk-geodat-linux-arm64 > dist/xk-geodat-linux-arm64.sha256
          sha256sum dist/xk-geodat-linux-mips > dist/xk-geodat-linux-mips.sha256
          sha256sum dist/xk-geodat-linux-mipsle > dist/xk-geodat-linux-mipsle.sha256
          sha256sum dist/happ-decrypt-universal-linux-arm64 > dist/happ-decrypt-universal-linux-arm64.sha256
          sha256sum dist/happ-decrypt-universal-linux-mips > dist/happ-decrypt-universal-linux-mips.sha256
          sha256sum dist/happ-decrypt-universal-linux-mipsle > dist/happ-decrypt-universal-linux-mipsle.sha256

          sha256sum \
            dist/xkeen-ui-routing.tar.gz \
            dist/xk-geodat-linux-arm64 \
            dist/xk-geodat-linux-mips \
            dist/xk-geodat-linux-mipsle \
            dist/happ-decrypt-universal-linux-arm64 \
            dist/happ-decrypt-universal-linux-mips \
            dist/happ-decrypt-universal-linux-mipsle \
            > dist/SHA256SUMS

      - name: Build modular panel release assets
        env:
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          else
            VERSION="0.0.0-dev.${GITHUB_SHA::12}"
          fi
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct "${GITHUB_SHA}")"
          # Пакеты модулей режутся из того же дерева, что и основной архив:
          # со сжатой статикой и с картой, которая это дерево описывает.
          python scripts/build_modular_panel_release.py \
            --root package-root \
            --output-dir dist/modular-panel \
            --version "${VERSION}" \
            --source-date-epoch "${SOURCE_DATE_EPOCH}" \
            --source-commit "${GITHUB_SHA}"

      - name: Sign modular panel catalog
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          XKEEN_RELEASE_ED25519_PRIVATE_KEY: ${{ secrets.XKEEN_RELEASE_ED25519_PRIVATE_KEY }}
        run: |
          python scripts/sign_modular_panel_catalog.py \
            --catalog dist/modular-panel/catalog.json \
            --metadata dist/modular-panel/release-metadata.json \
            --key-id release-2026 \
            --private-key-env XKEEN_RELEASE_ED25519_PRIVATE_KEY

      - name: Validate modular panel release assets
        run: |
          PYTHONPATH=xkeen-ui python - <<'PY'
          import json
          import os
          from pathlib import Path

          from services.module_catalog_trust import verify_catalog_signature
          from services.module_package_contract import validate_catalog_entry, validate_module_archive

          root = Path("dist/modular-panel")
          catalog = json.loads((root / "catalog.json").read_text(encoding="utf-8"))
          # The payload does not depend on the CPU: every router architecture
          # the panel installs on must find itself in the catalog.
          for architecture in ("aarch64", "mips", "mipsel"):
              for entry in catalog["modules"]:
                  validate_catalog_entry(entry, platform_architecture=architecture, core_version="1.0.0")
                  validate_module_archive(
                      root / entry["archive"],
                      entry,
                      platform_architecture=architecture,
                      core_version="1.0.0",
                  )
          metadata = json.loads((root / "release-metadata.json").read_text(encoding="utf-8"))
          signature_path = root / "catalog.json.sig"
          is_tag = os.environ.get("GITHUB_REF", "").startswith("refs/tags/v")
          if is_tag:
              if not signature_path.is_file():
                  raise SystemExit("tag release is missing catalog.json.sig")
              verify_catalog_signature((root / "catalog.json").read_bytes(), signature_path.read_bytes())
          elif signature_path.exists():
              raise SystemExit("branch build must not contain catalog.json.sig")
          actual = {path.name for path in root.iterdir()}
          if set(metadata["assets"]) != actual:
              raise SystemExit(f"metadata asset mismatch: {sorted(actual ^ set(metadata['assets']))}")
          print(f"validated {len(catalog['modules'])} module archives and {len(actual)} assets")
          PY

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: release-assets
          path: |
            dist/xkeen-ui-routing.tar.gz
            dist/xkeen-ui-routing.tar.gz.sha256
            dist/xk-geodat-linux-arm64
            dist/xk-geodat-linux-arm64.sha256
            dist/xk-geodat-linux-mips
            dist/xk-geodat-linux-mips.sha256
            dist/xk-geodat-linux-mipsle
            dist/xk-geodat-linux-mipsle.sha256
            dist/happ-decrypt-universal-linux-arm64
            dist/happ-decrypt-universal-linux-arm64.sha256
            dist/happ-decrypt-universal-linux-mips
            dist/happ-decrypt-universal-linux-mips.sha256
            dist/happ-decrypt-universal-linux-mipsle
            dist/happ-decrypt-universal-linux-mipsle.sha256
            dist/SHA256SUMS
            dist/modular-panel/**

      - name: Ensure GitHub CLI is available
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y gh
          fi

      - name: Create or update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              dist/xkeen-ui-routing.tar.gz \
              dist/xkeen-ui-routing.tar.gz.sha256 \
              dist/xk-geodat-linux-arm64 \
              dist/xk-geodat-linux-arm64.sha256 \
              dist/xk-geodat-linux-mips \
              dist/xk-geodat-linux-mips.sha256 \
              dist/xk-geodat-linux-mipsle \
              dist/xk-geodat-linux-mipsle.sha256 \
              dist/happ-decrypt-universal-linux-arm64 \
              dist/happ-decrypt-universal-linux-arm64.sha256 \
              dist/happ-decrypt-universal-linux-mips \
              dist/happ-decrypt-universal-linux-mips.sha256 \
              dist/happ-decrypt-universal-linux-mipsle \
              dist/happ-decrypt-universal-linux-mipsle.sha256 \
              dist/SHA256SUMS \
              $(python -c 'import json; from pathlib import Path; print(" ".join("dist/modular-panel/" + item for item in json.loads(Path("dist/modular-panel/release-metadata.json").read_text())["assets"]))') \
              --clobber
          else
            gh release create "$TAG" \
              dist/xkeen-ui-routing.tar.gz \
              dist/xkeen-ui-routing.tar.gz.sha256 \
              dist/xk-geodat-linux-arm64 \
              dist/xk-geodat-linux-arm64.sha256 \
              dist/xk-geodat-linux-mips \
              dist/xk-geodat-linux-mips.sha256 \
              dist/xk-geodat-linux-mipsle \
              dist/xk-geodat-linux-mipsle.sha256 \
              dist/happ-decrypt-universal-linux-arm64 \
              dist/happ-decrypt-universal-linux-arm64.sha256 \
              dist/happ-decrypt-universal-linux-mips \
              dist/happ-decrypt-universal-linux-mips.sha256 \
              dist/happ-decrypt-universal-linux-mipsle \
              dist/happ-decrypt-universal-linux-mipsle.sha256 \
              dist/SHA256SUMS \
              $(python -c 'import json; from pathlib import Path; print(" ".join("dist/modular-panel/" + item for item in json.loads(Path("dist/modular-panel/release-metadata.json").read_text())["assets"]))') \
              --title "$TAG" \
              --notes "Установочный архив панели, Android-приложение и бинарники вспомогательных утилит."
          fi
