name: CI

on:
  push:
    branches:
      - main
      - '**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend
        run: npm run frontend:build

      - name: Run Python tests
        run: python -m pytest -q

      - name: Verify frontend build
        run: node scripts/verify_frontend_build.mjs

      - name: Install Chromium for Mihomo local acceptance
        timeout-minutes: 15
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "120000"
        run: |
          sudo tee /etc/apt/apt.conf.d/99xkeen-ci-timeouts >/dev/null <<'EOF'
          Acquire::Retries "3";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          EOF

          for attempt in 1 2 3; do
            echo "Playwright Chromium install attempt ${attempt}/3"
            # Do not put a short hard timeout around --with-deps: terminating
            # it midway through apt can leave its dpkg lock behind, making all
            # retries fail. The step-level 15-minute timeout remains the
            # overall guard.
            if npx playwright install --with-deps chromium; then
              exit 0
            else
              rc=$?
            fi

            echo "Playwright install attempt ${attempt} failed (exit ${rc})."
            if [ "$attempt" -eq 3 ]; then
              exit "$rc"
            fi

            sleep $((attempt * 10))
          done

      - name: Run Mihomo Clash local acceptance
        timeout-minutes: 8
        run: >-
          npx playwright test
          e2e/mihomo_clash_groups.spec.mjs
          e2e/mihomo_clash_connections.spec.mjs
          e2e/mihomo_clash_pr8_acceptance.spec.mjs
          e2e/mihomo_clash_rules.spec.mjs
          --reporter=line
